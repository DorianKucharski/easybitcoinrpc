name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Check that the lock file matches pyproject.toml
        run: uv lock --check

      - name: Install the project and its dev group
        run: uv sync --frozen --python ${{ matrix.python-version }}

      - name: Run the tests
        run: uv run --frozen pytest -q
